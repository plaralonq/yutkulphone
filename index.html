<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11131b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Yushi Phone">
  <title>Yushi's iPhone</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <section class="phone" aria-label="Virtual iPhone">
      <div class="hardware">
        <span class="speaker"></span><span class="camera"></span>
      </div>
      <div class="screen wallpaper" id="screen">
        <div class="status-bar"><span id="status-time">9:41</span><span class="status-icons">●●●  ▰</span></div>

        <section class="view lock-view active" id="lock-view">
          <div class="lock-top"><span class="tiny-date" id="lock-date">วันอังคารที่ 20 ตุลาคม</span>
            <div class="lock-time" id="lock-time">20:28</div>
            <div class="lock-hint">แตะเพื่อปลดล็อก</div>
          </div>
          <div class="lock-bottom">
            <button class="round-control" id="flashlight" aria-label="ไฟฉาย">◉</button>
            <button class="unlock-pill" id="unlock-button">ปัดขึ้นเพื่อปลดล็อก ↑</button>
            <button class="round-control" id="camera-shortcut" aria-label="กล้อง">⌾</button>
          </div>
        </section>

        <section class="view passcode-view" id="passcode-view">
          <button class="back-link" id="passcode-back">‹ กลับ</button>
          <div class="passcode-title"><div class="avatar">悠</div><h2>Tokuno Yushi</h2><p>ป้อนรหัสเพื่อปลดล็อก iPhone</p></div>
          <div class="dots" id="dots" aria-label="รหัสผ่าน"><i></i><i></i><i></i><i></i></div>
          <p class="passcode-message" id="passcode-message">ใส่รหัส 4 หลัก</p>
          <div class="keypad" id="keypad">
            <button data-digit="1">1</button><button data-digit="2">2</button><button data-digit="3">3</button>
            <button data-digit="4">4</button><button data-digit="5">5</button><button data-digit="6">6</button>
            <button data-digit="7">7</button><button data-digit="8">8</button><button data-digit="9">9</button>
            <span></span><button data-digit="0">0</button><button id="delete-digit" class="delete-key">ลบ</button>
          </div>
        </section>

        <section class="view home-view" id="home-view">
          <div class="home-heading"><div><p id="home-date">TUESDAY, OCTOBER 20</p><h1>Yushi's phone</h1></div><span class="profile-chip">悠</span></div>
          <div class="app-grid" id="app-grid"></div>
          <div class="dock" id="dock"></div>
        </section>

        <section class="view app-view" id="app-view">
          <header class="app-header"><button id="home-button" aria-label="กลับหน้าหลัก">‹</button><h2 id="app-title">App</h2><button id="app-more" aria-label="เพิ่มเติม">•••</button></header>
          <div class="app-content" id="app-content"></div>
        </section>
        <div class="home-indicator" id="home-indicator"></div>
      </div>
    </section>
    <p class="outside-caption">A little window into <strong>Tokuno Yushi</strong>'s phone ♡</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
